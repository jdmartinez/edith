[package]
name = "edith-gpui-prototype"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["ui"]
ui = ["dep:gpui"]

[dependencies]
anyhow = "1"
dirs = "6"
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"], optional = true }
interprocess = "=2.4.9"
portable-pty = "=0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vt100 = "=0.15.2"
chrono = { version = "0.4", default-features = false, features = ["std"] }
rusqlite = { version = "0.43", default-features = false, features = ["bundled"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
